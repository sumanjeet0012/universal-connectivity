exclude: '^py-peer/llm/|^llm/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: mypy-local
        name: run mypy with all dev dependencies present
        entry: bash -c 'cd py-peer && mypy'
        language: system
        always_run: true
        pass_filenames: false
      - id: pyrefly-local
        name: run pyrefly with all dev dependencies present
        entry: bash -c 'cd py-peer && pyrefly check'
        language: system
        always_run: true
        pass_filenames: false
