[project]
name = "py-peer"
version = "0.1.0"
description = "Python implementation of the Universal Connectivity peer and p2p chat experience."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.47.0",
    "libp2p @ git+https://github.com/sumanjeet0012/py-libp2p.git@fbf4ff94d7201edfa90992574c4879738f2dab96",
    "trio>=0.22.0",
    "base58",
    "protobuf>=6.32.1,<7",
    "janus>=1.0.0",
    "trio_asyncio",
    "python-dotenv>=1.2.2",
    "platformdirs>=4.0.0",
    "groq>=1.0.0",
    "tornado>=6.5.5"
]

[project.scripts]
py-peer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The project uses a flat layout: runnable modules live at the repository root
# next to the ``api``, ``app``, and ``llm`` packages. ``only-include`` keeps the
# large React workspace, local data, and caches out of the wheel.
[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "headless.py",
    "chatroom.py",
    "tornado_server.py",
    "ui.py",
    "rag_handler.py",
    "healthcheck.py",
    "api",
    "app",
    "llm",
]

# The source distribution carries the Python project and its review assets.
# The React frontend is a separate project, so no frontend dependencies or
# local runtime state belong here.
[tool.hatch.build.targets.sdist]
only-include = [
    "main.py",
    "headless.py",
    "chatroom.py",
    "tornado_server.py",
    "ui.py",
    "rag_handler.py",
    "healthcheck.py",
    "api",
    "app",
    "llm",
    "assets",
    "Dockerfile",
    "compose.yaml",
    ".dockerignore",
    "README.md",
    "API_REFERENCE.md",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
]

[tool.hatch.metadata]
allow-direct-references = true
