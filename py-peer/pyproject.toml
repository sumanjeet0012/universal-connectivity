[project]
name = "py-peer"
version = "0.1.0"
description = "Python implementation of the Universal Connectivity peer and p2p chat experience."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.47.0",
    "libp2p @ git+https://github.com/sumanjeet0012/py-libp2p.git@fbf4ff94d7201edfa90992574c4879738f2dab96",
    "trio>=0.22.0",
    "base58",
    "protobuf>=6.32.1,<7",
    "janus>=1.0.0",
    "trio_asyncio",
    "python-dotenv>=1.2.2",
    "platformdirs>=4.0.0",
    "tornado>=6.5.5"
]

# The Groq SDK is only used by the optional RAG assistant (POST /api/v1/ask).
# Install with ``uv pip install -e '.[rag]'`` (or requirements-rag.txt) when
# the vector store and LLM endpoint are actually needed.
[project.optional-dependencies]
rag = [
    "groq>=1.0.0",
]


[project.scripts]
py-peer = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only the entry point and Python packages are shipped; the transport engine
# lives in ``core``, application/domain code in ``app``, HTTP adapters in
# ``api``, and the Textual adapter in ``ui``. The repository root stays limited
# to project files.
[tool.hatch.build.targets.wheel]
only-include = [
    "main.py",
    "core",
    "ui",
    "api",
    "app",
    "llm",
]

# The source distribution carries the Python project and its review assets.
# The React frontend is a separate project, so no frontend dependencies or
# local runtime state belong here.
[tool.hatch.build.targets.sdist]
only-include = [
    "main.py",
    "core",
    "ui",
    "api",
    "app",
    "llm",
    "assets",
    "Dockerfile",
    "docker-compose.yml",
    "requirements-rag.txt",
    "requirements-dev.txt",
    ".dockerignore",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    ".python-version",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
python_version = "3.12"
files = ["main.py", "core", "app", "api", "ui"]
exclude = ["^llm/"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
ignore_missing_imports = true
incremental = false
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false
show_error_codes = true
pretty = true

# libp2p ships ``py.typed``; these third-party packages do not.
[[tool.mypy.overrides]]
module = ["multiaddr.*", "trio_asyncio.*"]
ignore_missing_imports = true

# Pyrefly runs alongside mypy in py-libp2p. It checks the same application
# modules; the optional RAG tree is excluded because its third-party packages
# are not part of the base install.
[tool.pyrefly]
python_version = "3.12"
project_includes = ["main.py", "core", "app", "api", "ui"]
project_excludes = ["llm/**"]
# These optional/third-party packages do not ship type information in all
# installs, matching the mypy ``ignore_missing_imports`` policy above.
replace_imports_with_any = [
    "multiaddr",
    "multiaddr.*",
    "trio_asyncio",
    "trio_asyncio.*",
    "langchain_huggingface.*",
    "langchain_chroma.*",
    "langchain_community.*",
    "langchain_text_splitters.*",
    "groq",
    "groq.*",
]

# Tornado dispatches ``get``/``post`` handlers with route arguments that are
# not part of the base class's call signature, so its handlers cannot satisfy
# Pyrefly's Liskov override check. Keep the check everywhere else.
[[tool.pyrefly.sub_config]]
matches = "api/**"
[tool.pyrefly.sub_config.errors]
bad-override = false

[[tool.pyrefly.sub_config]]
matches = "core/rag_handler.py"
[tool.pyrefly.sub_config.errors]
bad-override = false
